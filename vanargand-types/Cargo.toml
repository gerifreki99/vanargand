[package]
name = "vanargand-types"
description = "Structures canoniques : derivation d'adresse, Bech32m (van1...), nonce 2D, enveloppe de transaction -- vecteurs de test ecrits avant l'implementation, encodage gele apres le bloc d'origine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
vanargand-crypto.workspace = true

[dev-dependencies]
# The insecure test signer, so that transactions and headers can be signed and
# verified end to end without a post-quantum dependency. Enabling it here rather
# than in [dependencies] means a production build of this crate cannot reach it.
vanargand-crypto = { workspace = true, features = ["test-backend"] }
# Test-only: reads the conformance vectors in spec/vectors/. Not a consensus
# dependency and never linked into a node.
serde_json.workspace = true
