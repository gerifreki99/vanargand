[package]
name = "vanargand-node"
description = "Assemblage du noeud complet : relie crypto/types/state/consensus/net, expose le RPC consomme par les clients legers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
vanargand-consensus.workspace = true
vanargand-crypto.workspace = true
vanargand-state.workspace = true
vanargand-types.workspace = true

[dev-dependencies]
# The insecure test signer, so that a block can be proposed, signed, certified
# and validated end to end without a post-quantum dependency.
vanargand-crypto = { workspace = true, features = ["test-backend"] }
