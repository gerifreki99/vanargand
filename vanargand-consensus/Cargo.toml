[package]
name = "vanargand-consensus"
description = "Preuve de Service : epoques, tirage du comite, alea par chaine d'engagements + VDF, echelle de finalite a trois barreaux, fuite d'inactivite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
vanargand-crypto.workspace = true
vanargand-types.workspace = true

[dev-dependencies]
