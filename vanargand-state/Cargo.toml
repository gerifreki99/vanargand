[package]
name = "vanargand-state"
description = "Arbre de Merkle epars (SMT) et execution deterministe des transitions d'etat : soldes, solde nomade, noms, gardiens, appareils, cautions de validateurs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
vanargand-crypto.workspace = true
vanargand-types.workspace = true

[dev-dependencies]
# The insecure test signer, so that accounts can hold device keys in tests
# without a post-quantum dependency.
vanargand-crypto = { workspace = true, features = ["test-backend"] }
